<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUA_EMPRESA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--side:#1b2420;--st:#f3f1ec;--sm:#aeb8b2;--bg:#fafafa;--sf:#fff;--t:#1d2421;--m:#6b756f;--b:#e3e6e4;--acc:#3f5a4e;--me:#3f5a4e;--ot:#eef0ee;--err:#b3412f}
@media(prefers-color-scheme:dark){:root{--bg:#141916;--sf:#1c2320;--t:#eceee9;--m:#97a29b;--b:#2b3430;--acc:#5f8574;--ot:#26302b;--me:#4d7061}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:8px;background:var(--sf)}
label{display:block;font-size:12px;font-weight:500;margin:12px 0 4px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500}
.btn.g{background:transparent;color:var(--t);border:1px solid var(--b)}.btn.sm{padding:6px 12px;font-size:12px}.btn:disabled{opacity:.5}
.err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}.ok{color:var(--acc)}.mut{color:var(--m);font-size:12px}
.logo{height:22px;width:auto;border-radius:4px;vertical-align:middle}.logo.big{height:64px;display:block;margin:6px 0}
.brand{display:flex;gap:8px;align-items:center;font-family:'Playfair Display',serif;font-size:15px}
.demo{background:#7a5c12;color:#fff;font-size:12px;padding:6px 14px;text-align:center}
.land{max-width:900px;margin:0 auto;padding:0 20px 40px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.lhero{background:var(--side);color:var(--st);border-radius:16px;padding:44px 32px}
.lhero h1{font-size:clamp(30px,6vw,48px);line-height:1.1}.lhero p{color:var(--sm);max-width:540px;margin:14px 0 22px;white-space:pre-wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.card{border:1px solid var(--b);background:var(--sf);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;white-space:pre-wrap}
.card span{color:var(--m);font-size:13px}.lsec{margin-top:30px}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:var(--side);color:var(--st);padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between}
.hero h1{font-size:clamp(28px,3.4vw,42px);line-height:1.15;max-width:420px}.hero p{color:var(--sm);max-width:340px;margin:14px 0 0}.hero small{color:var(--sm);font-size:11px}
.fw{display:flex;align-items:center;justify-content:center;padding:32px}.form{width:100%;max-width:340px}.form h2{font-size:24px}
.form .btn{width:100%;margin-top:16px;padding:12px}.sw2{text-align:center;font-size:12px;color:var(--m);margin-top:16px}.sw2 a{color:var(--t);font-weight:600;cursor:pointer}
@media(max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:24px;gap:24px}}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--side);color:var(--st)}
.top .who{font-size:12px;color:var(--sm);margin-right:10px}.top .btn.g{color:var(--st);border-color:#46534c}
.tabs{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--b);overflow-x:auto}
.tab{background:none;border:0;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--m);white-space:nowrap}.tab.on{background:var(--acc);color:#fff}
.main{flex:1;min-height:0;display:flex}.list{width:270px;border-right:1px solid var(--b);overflow:auto}
.item{padding:12px 16px;border-bottom:1px solid var(--b);cursor:pointer}.item.on{background:var(--ot)}.item b{display:flex;justify-content:space-between}
.item span{color:var(--m);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{background:var(--acc);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-style:normal}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{padding:10px 16px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;background:var(--ot);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--me);color:#fff;align-self:flex-end}.m small{display:block;opacity:.65;font-size:10px}
.send{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--b)}.empty{margin:auto;color:var(--m);text-align:center;padding:20px}
.pane{padding:20px;overflow:auto;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:760px}.grid .full{grid-column:1/-1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--b);border-radius:10px;background:var(--sf);margin-top:8px;max-width:760px}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;margin:0}.sw input{width:auto}.days{display:flex;gap:10px;flex-wrap:wrap}
.box{border:1px solid var(--b);border-radius:12px;padding:14px;max-width:760px;margin-bottom:18px;background:var(--sf)}
@media(max-width:700px){.list{width:100%;max-height:34%;border-right:0;border-bottom:1px solid var(--b)}.main.col{flex-direction:column}.m{max-width:88%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const TK='collo_token',leaf='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/></svg>';
const R0={view:'landing',err:'',ok:'',tab:'chat',sel:null,user:null,convs:[],msgs:[],appts:[],aiAll:false,hours:null,cfg:null,pats:[],bans:[],cf:null,logo:undefined};
let S={...R0,P:{site_name:'SUA_EMPRESA'},demo:false};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=i=>new Date(i).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),dt=i=>new Date(i).toLocaleDateString('pt-BR');
const getT=()=>{try{return localStorage.getItem(TK)}catch(e){return null}},setT=v=>{try{v?localStorage.setItem(TK,v):localStorage.removeItem(TK)}catch(e){}};
async function api(p,o={}){
 if(S.demo)return mock(p,o.method||'GET',o.body,getT());
 const h={'Content-Type':'application/json'},t=getT();if(t)h.Authorization='Bearer '+t;
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok){const e=new Error(typeof d?.detail==='string'?d.detail:'Erro no servidor ('+r.status+')');e.status=r.status;throw e}return d}
const brand=()=>(S.P.logo?`<img class="logo" src="${esc(S.P.logo)}" alt="">`:leaf)+' '+esc(S.P.site_name);
const ABOUT='Clínica de psicologia com atendimento presencial e online. Agende sua consulta e converse diretamente com a nossa recepção.';

function landing(){const P=S.P,sv=(P.services||'').split('\n').map(x=>x.trim()).filter(Boolean),inf=[['Horário de funcionamento',P.hours_text],['Endereço',P.address],['Contato',P.contact]].filter(x=>x[1]);
return `<div class="land"><div class="lh"><div class="brand">${brand()}</div><button class="btn g sm" data-go="login">Entrar</button></div>
<section class="lhero"><h1>${esc(P.site_name)}</h1><p>${esc(P.about||ABOUT)}</p><button class="btn" data-go="register">Agendar primeira consulta</button></section>
<section class="lsec"><h3 class="serif">Como funciona</h3><div class="cards"><div class="card"><b>1. Crie sua conta</b><span>Informe nome, email e telefone.</span></div><div class="card"><b>2. Converse com a recepção</b><span>Tire dúvidas pelo chat do site.</span></div><div class="card"><b>3. Agende</b><span>A recepção confirma o horário da sua consulta.</span></div></div></section>
${sv.length?`<section class="lsec"><h3 class="serif">Atendimento</h3><div class="cards">${sv.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div></section>`:''}
${inf.length?`<section class="lsec"><h3 class="serif">Informações</h3><div class="cards">${inf.map(x=>`<div class="card"><span>${x[0]}</span>${esc(x[1])}</div>`).join('')}</div></section>`:''}</div>`}

function authV(){const reg=S.view==='register';
return `<div class="auth"><section class="hero"><div class="brand">${brand()}</div><div><h1>Um espaço de escuta, cuidado e acolhimento.</h1><p>Clínica de Psicologia. Agende sua consulta e converse diretamente com a nossa recepção.</p></div><small><a style="color:inherit;cursor:pointer" data-go="landing">← Conheça a clínica</a> · Presencial e Online</small></section>
<section class="fw"><form class="form" id="af"><h2>${reg?'Criar conta':'Bem-vindo de volta'}</h2><div class="mut" style="margin:2px 0 6px">${reg?'Cadastre-se para agendar e conversar com a recepção.':'Entre para acessar seu espaço de atendimento.'}</div>
${reg?'<label>Nome</label><input name="name" required><label>Telefone</label><input name="phone" required placeholder="(11) 90000-0000">':''}
<label>${reg?'Email':'Email ou usuário'}</label><input name="email" ${reg?'type="email"':''} required><label>Senha</label><input name="password" type="password" required minlength="${reg?6:1}">
<div class="err">${esc(S.err)}</div><button class="btn">${reg?'Cadastrar':'Entrar'}</button>
<div class="sw2">${reg?'Já tem conta?':'Ainda não tem conta?'} <a data-go="${reg?'login':'register'}">${reg?'Entrar':'Cadastre-se'}</a></div></form></section></div>`}

const topbar=u=>`<div class="top"><div class="brand">${brand()}</div><div><span class="who">${esc(u.name)}</span><button class="btn g sm" id="out">Sair</button></div></div>`;
const bub=(m,v)=>`<div class="m ${m.sender===v?'me':''}"><small>${{patient:'Paciente',reception:'Recepção',ai:'Atendente virtual'}[m.sender]} · ${hm(m.created_at)}</small>${esc(m.text)}</div>`;
const cfBtn=(k,l,id)=>`<button class="btn g sm" id="${id||k}" data-cf="${k}">${S.cf===k?'Confirmar?':l}</button>`;

function patientV(u){return `<div class="app">${topbar(u)}<div class="chat"><div class="chead"><div><h3 class="serif">Fale com a recepção</h3><div class="mut">Respondemos o mais breve possível.</div></div></div>
<div class="msgs" id="msgs">${S.msgs.length?S.msgs.map(m=>bub(m,'patient')).join(''):'<div class="empty">Envie uma mensagem para agendar sua primeira consulta.</div>'}</div><div class="err" style="padding:0 16px">${esc(S.err)}</div>
<form class="send" id="sf"><input name="t" placeholder="Digite sua mensagem" autocomplete="off" required><button class="btn">Enviar</button></form></div></div>`}

function staffV(u){const T=[['chat','Conversas'],['agenda','Agenda']].concat(u.role==='admin'?[['cfg','Site'],['ban','Bloqueios']]:[]);
return `<div class="app">${topbar(u)}<div class="tabs">${T.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${{agenda:agendaV,cfg:cfgV,ban:banV}[S.tab]?.()||chatV()}</div>`}

function chatV(){const c=S.convs.find(x=>x.patient_id===S.sel);
return `<div class="main col"><div class="list"><div class="chead"><label class="sw"><input type="checkbox" id="aig" ${S.aiAll?'checked':''}> IA responde em todas as conversas</label></div>
${S.convs.length?S.convs.map(x=>`<div class="item ${x.patient_id===S.sel?'on':''}" data-c="${x.patient_id}"><b>${esc(x.patient_name)}${x.unread?`<i class="dot">${x.unread}</i>`:''}</b><span>${esc(x.last_message)}</span></div>`).join(''):'<div class="empty">Nenhuma conversa ainda.</div>'}</div>
<div class="chat">${c?`<div class="chead"><div><b>${esc(c.patient_name)}</b><div class="mut">${esc(c.phone)} · ${esc(c.email)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><label class="sw"><input type="checkbox" id="ai" ${c.ai_enabled?'checked':''}> IA</label>${cfBtn('dc','Excluir conversa')}${cfBtn('dp','Remover paciente')}</div></div>
<div class="msgs" id="msgs">${S.msgs.map(m=>bub(m,'reception')).join('')}</div><form class="send" id="rf"><input name="t" placeholder="Responder ao paciente" autocomplete="off" required><button class="btn">Enviar</button></form>`:'<div class="empty">Selecione uma conversa.</div>'}</div></div>`}

function agendaV(){const h=S.hours||{},d=h.days||[0,1,2,3,4],N=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
return `<div class="pane"><div class="box"><h3 class="serif" style="font-size:20px">Horários de atendimento</h3><div class="mut">A IA usa estes horários, menos as consultas marcadas, para informar o que está livre.</div>
<form id="hf"><div class="days" style="margin-top:8px">${N.map((n,i)=>`<label class="sw"><input type="checkbox" name="wd" value="${i}" ${d.includes(i)?'checked':''}>${n}</label>`).join('')}</div>
<div class="grid"><div><label>Início</label><input name="start" type="time" value="${h.start||'09:00'}" required></div><div><label>Fim</label><input name="end" type="time" value="${h.end||'17:00'}" required></div>
<div><label>Duração (min)</label><input name="duration" type="number" min="15" max="240" step="5" value="${h.duration||60}" required></div></div>
<div class="err ${S.ok?'ok':''}">${esc(S.ok||S.err)}</div><button class="btn sm">Salvar horários</button></form></div>
<h3 class="serif" style="font-size:20px">Nova consulta</h3><form id="apf" class="grid"><div><label>Paciente</label><input name="patient_name" required></div><div><label>Telefone</label><input name="phone" required></div>
<div><label>Data</label><input name="date" type="date" required></div><div><label>Horário</label><input name="time" type="time" required></div>
<div><label>Modalidade</label><select name="modality"><option>Presencial</option><option>Online</option></select></div><div class="full"><label>Observações</label><input name="notes"></div>
<div class="full"><div class="err">${esc(S.err)}</div><button class="btn">Agendar</button></div></form>
<h3 class="serif" style="font-size:20px;margin-top:22px">Consultas</h3>${S.appts.length?S.appts.map(a=>`<div class="row"><div><b>${esc(a.patient_name)}</b> · ${esc(a.modality)}<br><span class="mut">${a.date.split('-').reverse().join('/')} às ${esc(a.time)} · ${esc(a.phone)}${a.notes?' · '+esc(a.notes):''}</span></div>${cfBtn('da'+a.id,'Remover','x')}</div>`).join(''):'<div class="mut">Nenhuma consulta agendada.</div>'}</div>`}

function cfgV(){const c=S.cfg||{},lg=S.logo!==undefined?S.logo:c.logo;
return `<div class="pane"><form id="cf" class="box"><h3 class="serif" style="font-size:20px">Configurar o site</h3>
<label>Nome da empresa</label><input name="site_name" maxlength="60" value="${esc(c.site_name)}" required>
<label>Logo (aparece no topo e na apresentação)</label><img id="lp" class="logo big" src="${esc(lg)}" alt="" style="${lg?'':'display:none'}"><input type="file" id="lf" accept="image/*"><button type="button" class="btn g sm" id="lx" style="margin-top:6px">Remover logo</button>
<label>Sobre a empresa</label><textarea name="about" rows="4" maxlength="1500" placeholder="Se vazio, mostra um texto genérico">${esc(c.about)}</textarea>
<label>Atendimento / serviços (um por linha)</label><textarea name="services" rows="3" maxlength="1500">${esc(c.services)}</textarea>
<label>Horário de funcionamento (texto)</label><input name="hours_text" value="${esc(c.hours_text)}"><label>Endereço</label><input name="address" value="${esc(c.address)}"><label>Contato</label><input name="contact" value="${esc(c.contact)}">
<div class="mut" style="margin-top:8px">Só aparece na apresentação o que você preencher. Nada é inventado.</div><div class="err ${S.ok?'ok':''}">${esc(S.ok||S.err)}</div><button class="btn sm">Salvar</button></form></div>`}

function banV(){return `<div class="pane"><div class="mut" style="max-width:760px">O bloqueio dura 7 dias e é feito pelo endereço IP. IPs de celular e de provedores podem ser compartilhados por várias pessoas, e quem usa VPN troca de IP.</div><div class="err">${esc(S.err)}</div>
<h3 class="serif" style="font-size:20px">Pacientes</h3>${S.pats.length?S.pats.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><br><span class="mut">${esc(p.email)} · ${esc(p.phone)} · IP ${esc(p.last_ip||'desconhecido')}${p.banned_until?' · bloqueado até '+dt(p.banned_until):''}</span></div>${p.banned_until?'':`<button class="btn g sm" data-cf="b${p.id}" id="bn" ${p.last_ip?'':'disabled'}>${S.cf==='b'+p.id?'Confirmar?':'Banir 7 dias'}</button>`}</div>`).join(''):'<div class="mut">Nenhum paciente.</div>'}
<h3 class="serif" style="font-size:20px;margin-top:22px">Bloqueios ativos</h3>${S.bans.length?S.bans.map(b=>`<div class="row"><div><b>${esc(b.patient_name)}</b><br><span class="mut">IP ${esc(b.ip)} · até ${dt(b.until)}</span></div><button class="btn g sm" data-un="${b.id}">Desbloquear</button></div>`).join(''):'<div class="mut">Nenhum.</div>'}</div>`}

function render(){const a=document.activeElement,k=a&&a.tagName==='INPUT'&&a.name&&a.form&&a.form.id&&a.type!=='checkbox'?{f:a.form.id,n:a.name,v:a.value}:null,u=S.user;
 $('#root').innerHTML=(S.demo?'<div class="demo"><b>Demonstração.</b> Simulados: resposta da IA (texto de exemplo), endereços IP (fictícios), bloqueio de IP, banco de dados e horários de exemplo, tudo salvo só neste navegador. Admin: ADM_EMPRESA / ADM · Recepção: recepcao@demo.com / demo123</div>':'')+(!u?(S.view==='landing'?landing():authV()):u.role==='patient'?patientV(u):staffV(u));
 document.title=S.P.site_name;bind();if(k){const e=document.querySelector(`#${k.f} [name="${k.n}"]`);if(e){e.value=k.v;e.focus()}}}

async function load(){try{const u=S.user;if(u.role==='patient')S.msgs=await api('/chat/messages');
 else if(S.tab==='agenda'){S.appts=await api('/appointments');S.hours=await api('/settings/hours')}
 else if(S.tab==='cfg')S.cfg=await api('/admin/settings');
 else if(S.tab==='ban'){S.pats=await api('/admin/patients');S.bans=await api('/admin/bans')}
 else{S.convs=await api('/chat/conversations');S.aiAll=(await api('/settings/ai')).ai_all;if(S.sel)S.msgs=await api('/chat/conversations/'+S.sel+'/messages')}}
 catch(e){if(e.status===401)out();else if(e.status===403&&/bloqueado/.test(e.message)){out();S.view='login';S.err=e.message;render()}else S.err=e.message}}
function out(){setT(null);S={...R0,P:S.P,demo:S.demo};render()}
async function poll(){if(!S.user||['cfg','ban'].includes(S.tab)&&S.user.role!=='patient')return;const b=JSON.stringify([S.msgs,S.convs,S.appts,S.aiAll]);await load();if(S.user&&b!==JSON.stringify([S.msgs,S.convs,S.appts,S.aiAll]))render()}
const act=async(f,reload=true)=>{try{S.err='';await f();if(reload)await load()}catch(x){S.err=x.message}S.cf=null;render()};
const conf=(k,f)=>{if(S.cf===k){S.cf=null;f()}else{S.cf=k;render()}};

function bind(){const q=s=>document.querySelectorAll(s);
 q('[data-go]').forEach(b=>b.onclick=()=>{S.view=b.dataset.go;S.err='';render()});
 const af=$('#af');if(af)af.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(af));
  try{const d=await api(S.view==='register'?'/auth/register':'/auth/login',{method:'POST',body:f});setT(d.token);S.user=d.user;S.err='';S.tab='chat';S.sel=null;await load();render()}catch(x){S.err=x.message;render()}};
 if($('#out'))$('#out').onclick=out;
 q('[data-tab]').forEach(b=>b.onclick=async()=>{S.tab=b.dataset.tab;S.err=S.ok='';S.cf=null;S.logo=undefined;await load();render()});
 q('[data-c]').forEach(b=>b.onclick=async()=>{S.sel=b.dataset.c;S.msgs=[];S.cf=null;await load();render()});
 const sf=$('#sf');if(sf)sf.onsubmit=async e=>{e.preventDefault();const t=sf.t.value.trim();if(!t)return;S.msgs.push({sender:'patient',text:t,created_at:new Date().toISOString()});S.err='';render();
  try{await api('/chat/messages',{method:'POST',body:{text:t}});S.msgs=await api('/chat/messages')}catch(x){S.err=x.message}render()};
 const rf=$('#rf');if(rf)rf.onsubmit=e=>{e.preventDefault();const t=rf.t.value.trim();if(t)act(()=>api('/chat/conversations/'+S.sel+'/messages',{method:'POST',body:{text:t}}))};
 if($('#aig'))$('#aig').onchange=e=>act(async()=>{S.aiAll=(await api('/settings/ai',{method:'PUT',body:{enabled:e.target.checked}})).ai_all});
 if($('#ai'))$('#ai').onchange=e=>act(()=>api('/chat/conversations/'+S.sel+'/ai-toggle',{method:'POST',body:{enabled:e.target.checked}}));

 if($('#dp'))$('#dp').onclick=()=>conf('dp',()=>act(async()=>{await api('/patients/'+S.sel,{method:'DELETE'});S.sel=null;S.msgs=[]}));
 const hf=$('#hf');if(hf)hf.onsubmit=e=>{e.preventDefault();const f=new FormData(hf);S.ok='';
  act(async()=>{S.hours=await api('/settings/hours',{method:'PUT',body:{days:f.getAll('wd').map(Number),start:f.get('start'),end:f.get('end'),duration:+f.get('duration')}});S.ok='Horários salvos.'},false)};
 const apf=$('#apf');if(apf)apf.onsubmit=e=>{e.preventDefault();act(()=>api('/appointments',{method:'POST',body:Object.fromEntries(new FormData(apf))}))};
 q('[data-cf^="da"]').forEach(b=>b.onclick=()=>conf(b.dataset.cf,()=>act(()=>api('/appointments/'+b.dataset.cf.slice(2),{method:'DELETE'}))));
 const lf=$('#lf');if(lf)lf.onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');const p=$('#lp');p.src=S.logo;p.style.display='';URL.revokeObjectURL(u)};im.src=u};
 if($('#lx'))$('#lx').onclick=()=>{S.logo='';$('#lp').style.display='none'};
 const cf=$('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();const b=Object.fromEntries(new FormData(cf));if(S.logo!==undefined)b.logo=S.logo;S.ok='';
  act(async()=>{S.cfg=await api('/admin/settings',{method:'PUT',body:b});S.P=await api('/public/settings');S.logo=undefined;S.ok='Salvo.'},false)};
 q('#bn,[data-cf^="b"]').forEach(b=>b.onclick=()=>conf(b.dataset.cf,()=>act(()=>api('/admin/bans',{method:'POST',body:{patient_id:b.dataset.cf.slice(1)}}))));

/* ---- Backend de demonstração (usado só quando não há servidor) ---- */
const MK='collo_demo_v3';let MD=null;
function mdb(){if(MD)return MD;try{MD=JSON.parse(localStorage.getItem(MK))}catch(e){}
 return MD||(MD={seq:10,users:[{id:1,name:'Administrador',email:'adm_empresa',pw:'ADM',role:'admin',ip:'198.51.100.1'},{id:2,name:'Recepção',email:'recepcao@demo.com',pw:'demo123',role:'reception',ip:'198.51.100.2'}],
  msgs:[],convs:{},appts:[],bans:[],site:{site_name:'SUA_EMPRESA',logo:'',about:'',services:'',hours_text:'',address:'',contact:''},aiAll:false,hours:{days:[0,1,2,3,4],start:'09:00',end:'17:00',duration:60}})}
const msv=()=>{try{localStorage.setItem(MK,JSON.stringify(MD))}catch(e){}},fail=(s,m)=>{const e=new Error(m);e.status=s;throw e};
const p2=n=>String(n).padStart(2,'0'),iso=()=>new Date().toISOString();
function slots(d){const h=d.hours,W=['seg','ter','qua','qui','sex','sáb','dom'],n=new Date(),o=[];const[sh,sm]=h.start.split(':').map(Number),[eh,em]=h.end.split(':').map(Number);
 for(let i=0;i<=14;i++){const D=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i),wk=(D.getDay()+6)%7;if(!h.days.includes(wk))continue;
  const ds=D.getFullYear()+'-'+p2(D.getMonth()+1)+'-'+p2(D.getDate()),ts=[];
  for(let t=sh*60+sm;t+h.duration<=eh*60+em;t+=h.duration){const x=p2(t/60|0)+':'+p2(t%60);if(new Date(D.getFullYear(),D.getMonth(),D.getDate(),t/60|0,t%60)>n&&!d.appts.some(a=>a.date===ds&&a.time===x))ts.push(x)}
  if(ts.length)o.push(W[wk]+' '+p2(D.getDate())+'/'+p2(D.getMonth()+1)+': '+ts.join(', '))}return o}
function push(d,pid,s,t){d.msgs.push({id:++d.seq,pid,sender:s,text:t,read:s!=='patient',at:iso()});const c=d.convs[pid];if(c){c.last=t;c.at=iso()}}
function demoAI(d,pid){const l=slots(d);push(d,pid,'ai',!d.hours.days.length?'A recepção informará os horários disponíveis.':!l.length?'Não há horários livres nos próximos 14 dias. A recepção entrará em contato.':'Olá! Próximos horários livres: '+l.slice(0,4).join(' | ')+'. Informe o horário escolhido e seu telefone; a recepção confirma. (resposta simulada)')}
function delConv(d,pid){d.msgs=d.msgs.filter(x=>x.pid!==pid);delete d.convs[pid]}
async function mock(path,method,body,tok){
 const d=mdb(),now=Date.now(),act=()=>d.bans.filter(b=>b.until>now),U=tok&&d.users.find(u=>'t'+u.id===tok),B=body||{};
 if(U&&U.role==='patient'&&act().some(b=>b.ip===U.ip))fail(403,'Acesso bloqueado temporariamente.');
 const staff=()=>{if(!U)fail(401,'Não autenticado');if(U.role==='patient')fail(403,'Acesso restrito')},adm=()=>{if(!U||U.role!=='admin')fail(403,'Acesso restrito ao administrador')};
 const usr=u=>({id:String(u.id),name:u.name,email:u.email,phone:u.phone||'',role:u.role}),mo=x=>({id:String(x.id),sender:x.sender,text:x.text,created_at:x.at});let m;
 if(path==='/public/settings')return{...d.site};
 if(path==='/auth/register'){const e=(B.email||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))fail(400,'Email inválido');if((B.password||'').length<6)fail(400,'Senha muito curta (mínimo 6)');if(d.users.some(u=>u.email===e))fail(400,'Email já cadastrado');
  const u={id:++d.seq,name:B.name,email:e,phone:B.phone,pw:B.password,role:'patient',ip:'203.0.113.'+(d.seq*7%250+1)};d.users.push(u);msv();return{token:'t'+u.id,user:usr(u)}}
 if(path==='/auth/login'){const e=(B.email||'').trim().toLowerCase(),u=d.users.find(x=>x.email===e&&x.pw===B.password);if(!u)fail(401,'Usuário ou senha incorretos');if(u.role==='patient'&&act().some(b=>b.ip===u.ip))fail(403,'Acesso bloqueado temporariamente.');return{token:'t'+u.id,user:usr(u)}}
 if(path==='/chat/messages'){if(!U)fail(401,'Não autenticado');if(method==='GET')return d.msgs.filter(x=>x.pid===U.id).map(mo);
  const c=d.convs[U.id]||(d.convs[U.id]={pid:U.id,ai:null});Object.assign(c,{name:U.name,phone:U.phone||'',email:U.email});push(d,U.id,'patient',B.text);if(c.ai===null?d.aiAll:c.ai)demoAI(d,U.id);msv();return{ok:true}}
 if(path==='/chat/conversations'){staff();return Object.values(d.convs).sort((a,b)=>b.at.localeCompare(a.at)).map(c=>({id:String(c.pid),patient_id:String(c.pid),patient_name:c.name,phone:c.phone,email:c.email,last_message:c.last,ai_enabled:c.ai===null?d.aiAll:c.ai,unread:d.msgs.filter(x=>x.pid===c.pid&&x.sender==='patient'&&!x.read).length}))}
 if(m=path.match(/^\/chat\/conversations\/(\d+)(\/messages|\/ai-toggle)?$/)){staff();const pid=+m[1],c=d.convs[pid];
  if(!m[2]){delConv(d,pid);msv();return{ok:true}}
  if(m[2]==='/messages'){if(method==='GET'){d.msgs.forEach(x=>{if(x.pid===pid&&x.sender==='patient')x.read=true});msv();return d.msgs.filter(x=>x.pid===pid).map(mo)}push(d,pid,'reception',B.text);msv();return{ok:true}}
  if(c){c.ai=B.enabled;const l=[...d.msgs].reverse().find(x=>x.pid===pid);if(B.enabled&&l&&l.sender==='patient')demoAI(d,pid)}msv();return{ai_enabled:B.enabled}}
 if(m=path.match(/^\/patients\/(\d+)$/)){staff();const pid=+m[1],u=d.users.find(x=>x.id===pid&&x.role==='patient');delConv(d,pid);if(u){d.appts=d.appts.filter(a=>!(a.patient_name===u.name&&a.phone===u.phone));d.users=d.users.filter(x=>x!==u)}msv();return{ok:true}}
 if(path==='/settings/ai'){staff();if(method==='PUT'){d.aiAll=!!B.enabled;Object.values(d.convs).forEach(c=>c.ai=null);msv()}return{ai_all:d.aiAll}}
 if(path==='/settings/hours'){staff();if(method==='PUT'){if(!B.days.length)fail(400,'Marque ao menos um dia');d.hours={days:B.days,start:B.start,end:B.end,duration:B.duration};msv()}return d.hours}
 if(path==='/appointments'){staff();if(method==='GET')return d.appts.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(d.appts.some(a=>a.date===B.date&&a.time===B.time))fail(409,'Já existe uma consulta neste horário');const a={...B,id:String(++d.seq)};d.appts.push(a);msv();return a}
 if(m=path.match(/^\/appointments\/(\d+)$/)){staff();d.appts=d.appts.filter(a=>a.id!==m[1]);msv();return{ok:true}}
 if(path==='/admin/settings'){adm();if(method==='PUT'){Object.keys(d.site).forEach(k=>{if(B[k]!=null)d.site[k]=String(B[k])});if(!d.site.site_name.trim())d.site.site_name='SUA_EMPRESA';msv()}return{...d.site}}
 if(path==='/admin/patients'){adm();return d.users.filter(u=>u.role==='patient').map(u=>{const b=act().find(x=>x.ip===u.ip);return{id:String(u.id),name:u.name,email:u.email,phone:u.phone,last_ip:u.ip,banned_until:b?new Date(b.until).toISOString():null}})}
 if(path==='/admin/bans'){adm();if(method==='POST'){const u=d.users.find(x=>x.id===+B.patient_id);if(!u)fail(404,'Paciente não encontrado');d.bans.push({id:++d.seq,ip:u.ip,until:now+6048e5,name:u.name});msv();return{ok:true}}return act().map(b=>({id:String(b.id),ip:b.ip,patient_name:b.name,until:new Date(b.until).toISOString()}))}
 if(m=path.match(/^\/admin\/bans\/(\d+)$/)){adm();d.bans=d.bans.filter(b=>b.id!==+m[1]);msv();return{ok:true}}
 if(path==='/auth/me'){if(!U)fail(401,'Não autenticado');return usr(U)}
 fail(404,'Rota não encontrada')}

(async()=>{try{const r=await fetch('/api/public/settings');if(r.ok&&(r.headers.get('content-type')||'').includes('json'))S.P=await r.json();else S.demo=true}catch(e){S.demo=true}
 if(S.demo)S.P=await api('/public/settings');
 if(getT()){try{S.user=await api('/auth/me');S.view='login';await load()}catch(e){setT(null);S.user=null}}
 render();setInterval(poll,4000)})();
