<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carolina Collo · Clínica de Psicologia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--side:#1b2420;--side-t:#f3f1ec;--side-m:#aeb8b2;--bg:#fafafa;--surf:#fff;--t:#1d2421;--m:#6b756f;--b:#e3e6e4;--acc:#3f5a4e;--acc-t:#fff;--me:#3f5a4e;--me-t:#fff;--other:#eef0ee;--err:#b3412f}
@media (prefers-color-scheme:dark){:root{--bg:#141916;--surf:#1c2320;--t:#eceee9;--m:#97a29b;--b:#2b3430;--acc:#5f8574;--other:#26302b;--me:#4d7061}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:8px;background:var(--surf)}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:12px;font-weight:500;margin:14px 0 5px}
.btn{background:var(--acc);color:var(--acc-t);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--t);border:1px solid var(--b)}
.btn.sm{padding:6px 12px;font-size:12px}
.err{color:var(--err);font-size:12px;margin-top:10px;min-height:16px}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:var(--side);color:var(--side-t);padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;gap:8px;align-items:center;font-family:'Playfair Display',serif;font-size:15px}
.hero h1{font-size:clamp(28px,3.4vw,44px);line-height:1.15;max-width:420px}
.hero p{color:var(--side-m);max-width:340px;margin:16px 0 0}
.hero small{color:var(--side-m);font-size:11px}
.formwrap{display:flex;align-items:center;justify-content:center;padding:32px}
.form{width:100%;max-width:340px}
.form h2{font-size:24px}.form .sub{color:var(--m);font-size:12px;margin:2px 0 8px}
.form .btn{width:100%;margin-top:18px;padding:12px}
.switch{text-align:center;font-size:12px;color:var(--m);margin-top:18px}
.switch a{color:var(--t);font-weight:600;cursor:pointer}
@media(max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:24px;gap:28px}.hero h1{font-size:28px}}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--side);color:var(--side-t)}
.top .who{font-size:12px;color:var(--side-m);margin-right:12px}
.top .btn.ghost{color:var(--side-t);border-color:#46534c}
.tabs{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--b)}
.tab{background:none;border:0;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--m)}
.tab.on{background:var(--acc);color:var(--acc-t)}
.main{flex:1;min-height:0;display:flex}
.list{width:260px;border-right:1px solid var(--b);overflow:auto}
.item{padding:12px 16px;border-bottom:1px solid var(--b);cursor:pointer}
.item.on{background:var(--other)}.item b{display:flex;justify-content:space-between}
.item span{color:var(--m);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{background:var(--acc);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-style:normal}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{padding:12px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;background:var(--other);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--me);color:var(--me-t);align-self:flex-end}
.m small{display:block;opacity:.65;font-size:10px;margin-bottom:2px}
.send{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--b)}
.empty{margin:auto;color:var(--m);text-align:center;padding:20px}
.pane{padding:20px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:760px}
.grid .full{grid-column:1/-1}
.appt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--b);border-radius:10px;background:var(--surf);margin-top:8px;max-width:760px}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;margin:0}
.sw input{width:auto}
@media(max-width:700px){.list{width:100%;max-height:34%;border-right:0;border-bottom:1px solid var(--b)}.main.col{flex-direction:column}.m{max-width:88%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const TK='collo_token';
const leaf='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/></svg>';
let S={mode:'login',err:'',tab:'chat',sel:null,user:null,convs:[],msgs:[],appts:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const getT=()=>{try{return localStorage.getItem(TK)}catch(e){return null}};
const setT=v=>{try{v?localStorage.setItem(TK,v):localStorage.removeItem(TK)}catch(e){}};
async function api(p,o={}){const h={'Content-Type':'application/json'},t=getT();if(t)h.Authorization='Bearer '+t;
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok){const e=new Error(typeof d?.detail==='string'?d.detail:'Dados inválidos ou erro no servidor ('+r.status+')');e.status=r.status;throw e}return d}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

function authView(){const reg=S.mode==='register';
return `<div class="auth"><section class="hero"><div class="brand">${leaf} Carolina Collo</div>
<div><h1>Um espaço de escuta, cuidado e acolhimento.</h1><p>Clínica de Psicologia. Agende sua consulta e converse diretamente com a nossa recepção.</p></div>
<small>Psicologia clínica · Presencial e Online</small></section>
<section class="formwrap"><form class="form" id="af"><h2>${reg?'Criar conta':'Bem-vindo de volta'}</h2>
<div class="sub">${reg?'Cadastre-se para agendar e conversar com a recepção.':'Entre para acessar seu espaço de atendimento.'}</div>
${reg?'<label>Nome</label><input name="name" required placeholder="Seu nome completo"><label>Telefone</label><input name="phone" required placeholder="(11) 90000-0000">':''}
<label>Email</label><input name="email" type="email" required placeholder="voce@email.com">
<label>Senha</label><input name="password" type="password" required minlength="6" placeholder="••••••••">
<div class="err">${esc(S.err)}</div>
<button class="btn" type="submit">${reg?'Cadastrar':'Entrar'}</button>
<div class="switch">${reg?'Já tem conta?':'Ainda não tem conta?'} <a id="sw">${reg?'Entrar':'Cadastre-se'}</a></div></form></section></div>`}

const topbar=u=>`<div class="top"><div class="brand">${leaf} Carolina Collo</div><div><span class="who">${esc(u.name)}</span><button class="btn ghost sm" id="out">Sair</button></div></div>`;
const bubble=(m,v)=>{const lbl={patient:'Paciente',reception:'Recepção',ai:'Atendente virtual'}[m.sender];
return `<div class="m ${m.sender===v?'me':''}"><small>${lbl} · ${hm(m.created_at)}</small>${esc(m.text)}</div>`};

function patientView(u){return `<div class="app">${topbar(u)}<div class="chat"><div class="chead"><div><h3 class="serif">Fale com a recepção</h3><div style="color:var(--m);font-size:12px">Respondemos o mais breve possível.</div></div></div>
<div class="msgs" id="msgs">${S.msgs.length?S.msgs.map(m=>bubble(m,'patient')).join(''):'<div class="empty">Envie uma mensagem para agendar sua primeira consulta.</div>'}</div>
<div class="err" style="padding:0 20px">${esc(S.err)}</div>
<form class="send" id="sf"><input name="t" placeholder="Digite sua mensagem" autocomplete="off" required><button class="btn">Enviar</button></form></div></div>`}

function receptionView(u){
const tabs=`<div class="tabs"><button class="tab ${S.tab==='chat'?'on':''}" data-tab="chat">Conversas</button><button class="tab ${S.tab==='agenda'?'on':''}" data-tab="agenda">Agenda</button></div>`;
if(S.tab==='agenda')return `<div class="app">${topbar(u)}${tabs}<div class="pane"><h3 class="serif" style="font-size:22px">Nova consulta</h3>
<form id="apf" class="grid"><div><label>Paciente</label><input name="patient_name" required></div><div><label>Telefone</label><input name="phone" required></div>
<div><label>Data</label><input name="date" type="date" required></div><div><label>Horário</label><input name="time" type="time" required></div>
<div><label>Modalidade</label><select name="modality"><option>Presencial</option><option>Online</option></select></div>
<div class="full"><label>Observações</label><input name="notes"></div><div class="full"><div class="err">${esc(S.err)}</div><button class="btn">Agendar</button></div></form>
<h3 class="serif" style="font-size:22px;margin-top:26px">Consultas</h3>
${S.appts.length?S.appts.map(a=>`<div class="appt"><div><b>${esc(a.patient_name)}</b> · ${esc(a.modality)}<br><span style="color:var(--m);font-size:12px">${a.date.split('-').reverse().join('/')} às ${esc(a.time)} · ${esc(a.phone)}${a.notes?' · '+esc(a.notes):''}</span></div><button class="btn ghost sm" data-del="${a.id}">Remover</button></div>`).join(''):'<div style="color:var(--m);margin-top:8px">Nenhuma consulta agendada.</div>'}</div></div>`;
const c=S.convs.find(x=>x.patient_id===S.sel);
return `<div class="app">${topbar(u)}${tabs}<div class="main col"><div class="list">${S.convs.length?S.convs.map(x=>
`<div class="item ${x.patient_id===S.sel?'on':''}" data-c="${x.patient_id}"><b>${esc(x.patient_name)}${x.unread?`<i class="dot">${x.unread}</i>`:''}</b><span>${esc(x.last_message)}</span></div>`).join(''):'<div class="empty">Nenhuma conversa ainda.</div>'}</div>
<div class="chat">${c?`<div class="chead"><div><b>${esc(c.patient_name)}</b><div style="color:var(--m);font-size:12px">${esc(c.phone)} · ${esc(c.email)}</div></div>
<label class="sw"><input type="checkbox" id="ai" ${c.ai_enabled?'checked':''}> IA responde</label></div>
<div class="msgs" id="msgs">${S.msgs.map(m=>bubble(m,'reception')).join('')}</div>
<form class="send" id="rf"><input name="t" placeholder="Responder ao paciente" autocomplete="off" required><button class="btn">Enviar</button></form>`:'<div class="empty">Selecione uma conversa.</div>'}</div></div></div>`}

function render(){const a=document.activeElement;
 const keep=a&&a.tagName==='INPUT'&&a.name&&a.form&&a.form.id?{f:a.form.id,n:a.name,v:a.value,t:a.type}:null;
 const u=S.user;$('#root').innerHTML=!u?authView():u.role==='reception'?receptionView(u):patientView(u);bind();
 if(keep&&keep.t!=='checkbox'){const el=document.querySelector(`#${keep.f} [name="${keep.n}"]`);if(el){el.value=keep.v;el.focus()}}}

async function refresh(){try{if(S.user.role==='patient')S.msgs=await api('/chat/messages');
 else if(S.tab==='agenda')S.appts=await api('/appointments');
 else{S.convs=await api('/chat/conversations');if(S.sel)S.msgs=await api('/chat/conversations/'+S.sel+'/messages')}}
 catch(e){if(e.status===401)logout()}}
function logout(){setT(null);S={mode:'login',err:'',tab:'chat',sel:null,user:null,convs:[],msgs:[],appts:[]};render()}
async function poll(){if(!S.user)return;const before=JSON.stringify([S.msgs,S.convs,S.appts]);
 await refresh();if(S.user&&before!==JSON.stringify([S.msgs,S.convs,S.appts]))render()}

function bind(){
const af=$('#af');if(af){$('#sw').onclick=()=>{S.mode=S.mode==='login'?'register':'login';S.err='';render()};
 af.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(af));
  try{const d=await api(S.mode==='register'?'/auth/register':'/auth/login',{method:'POST',body:f});
   setT(d.token);S.user=d.user;S.err='';S.sel=null;S.tab='chat';S.msgs=[];S.convs=[];await refresh();render()}
  catch(x){S.err=x.message;render()}}}
if($('#out'))$('#out').onclick=logout;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{S.tab=b.dataset.tab;S.err='';await refresh();render()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{S.sel=b.dataset.c;S.msgs=[];await refresh();render()});
const sf=$('#sf');if(sf)sf.onsubmit=async e=>{e.preventDefault();const t=sf.t.value.trim();if(!t)return;
 S.msgs.push({sender:'patient',text:t,created_at:new Date().toISOString()});S.err='';render();
 try{await api('/chat/messages',{method:'POST',body:{text:t}});S.msgs=await api('/chat/messages')}catch(x){S.err=x.message}render()};
const rf=$('#rf');if(rf)rf.onsubmit=async e=>{e.preventDefault();const t=rf.t.value.trim();if(!t)return;
 try{await api('/chat/conversations/'+S.sel+'/messages',{method:'POST',body:{text:t}});await refresh()}catch(x){}render()};
const ai=$('#ai');if(ai)ai.onchange=async()=>{try{await api('/chat/conversations/'+S.sel+'/ai-toggle',{method:'POST',body:{enabled:ai.checked}});await refresh()}catch(x){}render()};
const apf=$('#apf');if(apf)apf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(apf));
 try{await api('/appointments',{method:'POST',body:f});S.err='';await refresh()}catch(x){S.err=x.message}render()};
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await api('/appointments/'+b.dataset.del,{method:'DELETE'});await refresh()}catch(x){}render()});
const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight}

(async()=>{if(getT()){try{S.user=await api('/auth/me')}catch(e){setT(null)}}if(S.user)await refresh();render();setInterval(poll,4000)})();
</script>
</body>
</html>
